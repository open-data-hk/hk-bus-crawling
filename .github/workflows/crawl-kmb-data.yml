name: Crawl KMB Data
on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

jobs:
  Crawl-KMB-Data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Crawl KMB raw data
        env:
          REQUEST_LIMIT: "6"
        run: uv run python ./crawling/kmb_crawl.py --force

      - name: Publish KMB raw data to "latest-kmb" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-kmb
          name: Latest KMB raw data
          body: Automatically updated by the Crawl KMB Data workflow.
          files: |
            data/kmb.raw.routeList.json
            data/kmb.raw.routeStopList.json
            data/kmb.raw.stopList.json

      - name: Upload KMB raw data to S3
        env:
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          pids=()
          aws s3 cp data/kmb.raw.routeList.json s3://${{ secrets.AWS_S3_BUCKET }}/transport/kmb/kmb.raw.routeList.json & pids+=($!)
          aws s3 cp data/kmb.raw.routeStopList.json s3://${{ secrets.AWS_S3_BUCKET }}/transport/kmb/kmb.raw.routeStopList.json & pids+=($!)
          aws s3 cp data/kmb.raw.stopList.json s3://${{ secrets.AWS_S3_BUCKET }}/transport/kmb/kmb.raw.stopList.json & pids+=($!)
          for pid in "${pids[@]}"; do wait "$pid"; done

      - name: Archive KMB raw data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KMB Raw Files
          retention-days: 14
          path: |
            data/kmb.raw.routeList.json
            data/kmb.raw.routeStopList.json
            data/kmb.raw.stopList.json
